services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: erp
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - erp-mongodb-data:/data/db
      - ./backend/src/scripts/init-mongo-rs.js:/docker-entrypoint-initdb.d/01-init-rs.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok && rs.status().myState === 1' | grep -q true"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  erp-mongodb-data:
